[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools', 'wheel']

[project]
name = 'pmi-lib'
version = '0.0.1'
description = 'PMI library - Group 2'
readme = 'README.md'
requires-python = '>=3.14'
license = 'MIT'
license-files = ['LICENSE.md']
authors = [
  {name = 'Lucia van den Boogaart', email = 'l.vandenboogaart@students.uu.nl'},
  {name = 'Werner Huiskes', email = 'w.huiskes@students.uu.nl'},
  {name = 'Soufyen Farhosh', email = 's.h.w.farhosh@students.uu.nl'},
  {name = 'Daphne Ploeg', email = 'd.ploeg1@students.uu.nl'},
]

dependencies = ["nibabel", "numpy", "pydicom", "scipy", "pmi-viewer", "click", "pylibjpeg", "pylibjpeg-libjpeg"]

[project.scripts]
dicom-to-nifti= "pmi_lib.cli:dicom_to_nifti"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

